# Login con la plantilla común de las apps (Arce Data Lab). Hereda todo del tema
# «keycloak» y solo añade una hoja de estilos: si algo falla, el login sigue funcionando.
parent=keycloak
import=common/keycloak
styles=css/login.css css/arcedatalab.css
# Fuera de los buscadores (Keycloak escribe un <meta> por cada nombre==valor, separados por espacio).
meta=viewport==width=device-width,initial-scale=1 robots==noindex,nofollow
